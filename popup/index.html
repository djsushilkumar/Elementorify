<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementorify Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-gradient: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
      --primary-hover: linear-gradient(135deg, #9333ea 0%, #0891b2 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --success: #22c55e;
    }

    /* Color Theme Overrides */
    body[data-theme="cyan"] {
      --primary-gradient: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      --primary-hover: linear-gradient(135deg, #0891b2 0%, #2563eb 100%);
      --accent: #60a5fa;
    }

    body[data-theme="emerald"] {
      --primary-gradient: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      --primary-hover: linear-gradient(135deg, #059669 0%, #0891b2 100%);
      --accent: #34d399;
    }

    body[data-theme="amber"] {
      --primary-gradient: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      --primary-hover: linear-gradient(135deg, #d97706 0%, #dc2626 100%);
      --accent: #fbbf24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      width: 350px;
      padding: 16px;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(168, 85, 247, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.1) 0px, transparent 50%);
      color: var(--text-main);
      overflow: hidden;
      border-radius: 12px;
      transition: background 0.3s ease;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.4);
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-sub);
    }

    .status-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      border-radius: 20px;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.2); }
    }

    /* Theme Customizer Row */
    .theme-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      font-size: 11px;
      color: var(--text-sub);
    }

    .theme-swatches {
      display: flex;
      gap: 6px;
    }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .swatch:hover {
      transform: scale(1.18);
    }

    .swatch.active {
      border-color: #ffffff;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    /* Main Inspect Button */
    .btn-inspect {
      width: 100%;
      padding: 13px;
      background: var(--primary-gradient);
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(168, 85, 247, 0.35);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-bottom: 18px;
    }

    .btn-inspect:hover {
      background: var(--primary-hover);
      transform: translateY(-1.5px);
      box-shadow: 0 6px 24px rgba(168, 85, 247, 0.5);
    }

    .btn-inspect:active {
      transform: translateY(0);
    }

    /* Section Headers */
    .section-header {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-sub);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Viewport Grid */
    .viewport-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .vp-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 9px 6px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .vp-btn:hover {
      border-color: rgba(168, 85, 247, 0.5);
      background: rgba(168, 85, 247, 0.1);
    }

    .vp-btn.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .vp-dim {
      font-size: 9px;
      color: var(--text-sub);
    }

    /* Info Card */
    .info-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 16px;
      backdrop-filter: blur(12px);
    }

    .empty-info {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-sub);
      line-height: 1.5;
      padding: 6px 0;
    }

    .data-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .data-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
    }

    .data-label {
      color: var(--text-sub);
    }

    .data-val {
      font-weight: 600;
      font-family: monospace;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 10.5px;
      color: var(--text-sub);
      padding-top: 4px;
    }
  </style>
</head>
<body data-theme="purple">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <img src="/icon-256.png" alt="Logo" class="brand-logo">
      <div>
        <div class="brand-title">Elementorify</div>
        <div class="brand-subtitle">HTML to Elementor Converter</div>
      </div>
    </div>
    <div class="status-tag">
      <span class="status-dot"></span> Active
    </div>
  </div>

  <!-- Theme Accent Customizer -->
  <div class="theme-row">
    <span>Accent Theme:</span>
    <div class="theme-swatches">
      <button class="swatch active" data-theme="purple" style="background: linear-gradient(135deg, #a855f7, #06b6d4);" title="Electric Purple"></button>
      <button class="swatch" data-theme="cyan" style="background: linear-gradient(135deg, #06b6d4, #3b82f6);" title="Cyber Cyan"></button>
      <button class="swatch" data-theme="emerald" style="background: linear-gradient(135deg, #10b981, #06b6d4);" title="Emerald Green"></button>
      <button class="swatch" data-theme="amber" style="background: linear-gradient(135deg, #f59e0b, #ef4444);" title="Sunset Amber"></button>
    </div>
  </div>

  <!-- Primary Action -->
  <button id="btn-inspect" class="btn-inspect">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="16"></line>
      <line x1="8" y1="12" x2="16" y2="12"></line>
    </svg>
    Inspect & Pick Element
  </button>
  <div style="text-align: center; font-size: 10.5px; color: var(--text-sub); margin-top: -12px; margin-bottom: 16px;">
    Shortcut: <kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; color: var(--accent); font-family: monospace;">Alt + Shift + E</kbd>
  </div>

  <!-- Viewport Emulation -->
  <div class="section-header">
    <span>Responsive Viewport</span>
  </div>
  <div class="viewport-container">
    <button id="vp-desktop" class="vp-btn">
      <span>🖥️ Desktop</span>
      <span class="vp-dim">1920 × 1080</span>
    </button>
    <button id="vp-tablet" class="vp-btn">
      <span>📱 Tablet</span>
      <span class="vp-dim">768 × 1024</span>
    </button>
    <button id="vp-mobile" class="vp-btn">
      <span>📲 Mobile</span>
      <span class="vp-dim">375 × 812</span>
    </button>
  </div>

  <!-- Global Palette Extractor -->
  <div class="section-header">
    <span>Global Style Palette</span>
  </div>
  <button id="btn-scan-palette" class="btn-inspect" style="background: rgba(255,255,255,0.06); border: 1px solid var(--card-border); color: var(--text-main); font-size: 12px; padding: 9px; margin-bottom: 10px; box-shadow: none;">
    🎨 Scan & Extract Page Palette
  </button>
  <div id="palette-card" class="info-card" style="display: none; margin-bottom: 16px;">
    <div id="palette-colors" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;"></div>
    <div id="palette-fonts" style="font-size: 11px; color: var(--text-sub); margin-bottom: 8px;"></div>
    <button id="btn-copy-kit" style="width: 100%; padding: 6px; background: rgba(56, 189, 248, 0.15); border: 1px solid var(--accent); color: var(--accent); border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer;">
      📋 Copy Elementor Kit JSON
    </button>
  </div>

  <!-- Footer -->
  <div class="footer">
    Elementorify v1.8.0 • Built for WordPress & Elementor
  </div>

  <script src="index.iife.js"></script>
</body>
</html>
